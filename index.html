<script>
    const APP_VERSION = "3.0.5";
    const defaultCategories = [
        { name: "NEW HANDSETS", target: 0, achieved: 0 },
        { name: "UPGRADES", target: 0, achieved: 0 },
        { name: "NEW PAYM/SIM", target: 0, achieved: 0 },
        { name: "NEW HBB", target: 0, achieved: 0 },
        { name: "REG HBB", target: 0, achieved: 0 },
        { name: "TV", target: 0, achieved: 0 }
    ];
    const defaultPacing = { completed: 0, total: 0, lastUpdate: "", monthLocked: false };
    
    let categories = JSON.parse(localStorage.getItem('eeRhylTargets')) || JSON.parse(JSON.stringify(defaultCategories));
    let pacingData = JSON.parse(localStorage.getItem('eeRhylPacing')) || JSON.parse(JSON.stringify(defaultPacing));
    let previousKPIs = JSON.parse(localStorage.getItem('eeRhylPrevKPIs')) || [0,0,0,0,0,0];
    
    let isInitial = true;
    let isSetupMode = false;
    let isDevMode = localStorage.getItem('eeRhylDevMode') === 'true'; 
    let isCoachMinimized = localStorage.getItem('eeRhylCoachMinimized') === 'true';
    let displayedCurrentOverall = 0;

    let scorecardUpdateQueue = {};
    let scorecardUpdateTimer = null;

    // Map Personal Calculator KPIs to Scorecard KPIs
    const kpiMapping = {
        "NEW HANDSETS": "NEW H/S",
        "UPGRADES": "UPG H/S",
        "NEW PAYM/SIM": "NEW CON",
        "NEW HBB": "NEW HBB",
        "REG HBB": "REG HBB",
        "TV": "TV"
    };

    const scColorMap = { "Red": "#e74c3c", "Amber": "#f39c12", "Green": "#27ae60", "Blue": "#3498db" };

    function fetchScorecard() {
        if (!SCORECARD_URL || SCORECARD_URL === "YOUR_SCRIPT_URL_HERE") return;
        let oldScript = document.getElementById('scorecard-jsonp');
        if (oldScript) oldScript.remove();
        let script = document.createElement('script');
        script.id = 'scorecard-jsonp';
        script.src = `${SCORECARD_URL}?action=read&callback=processScorecard&_bust=${Date.now()}`;
        document.body.appendChild(script);
    }

    function processScorecard(data) {
        if (data.error) {
            document.getElementById('sc-kpi-grid').innerHTML = `<div style="grid-column: 1 / -1; color:#e74c3c;">${data.error}</div>`;
            return;
        }

        let overallEl = document.getElementById('sc-overall-score');
        let scoreVal = parseFloat(data.overallScore);
        overallEl.innerText = isNaN(scoreVal) ? data.overallScore : scoreVal.toFixed(2);
        
        overallEl.className = 'score-overall';
        if(data.overallColor) overallEl.classList.add('color-' + data.overallColor.toLowerCase());

        let d = new Date();
        document.getElementById('sc-last-sync').innerText = `Live Sync Active • Last checked: ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;

        let gridHtml = '';
        data.kpis.forEach(kpi => {
            if(!kpi.name) return;
            let sold = kpi.soldToday;
            let remAmber = kpi.needAmber - sold;
            let remGreen = kpi.needGreen - sold;
            let remBlue = kpi.needBlue - sold;

            let displayColor = kpi.color;
            if (kpi.color === "Red" && remAmber <= 0) displayColor = "Amber";
            if ((displayColor === "Red" || displayColor === "Amber") && remGreen <= 0) displayColor = "Green";
            if (displayColor !== "Blue" && remBlue <= 0) displayColor = "Blue";

            let topBorder = scColorMap[displayColor] || "#95a5a6";
            
            gridHtml += `<div class="kpi-badge" style="border-top-color: ${topBorder}">
                <span class="kpi-name">${kpi.name}</span>`;
            
            let isTrackOnly = (kpi.needAmber===0 && kpi.needGreen===0 && kpi.needBlue===0);

            if (isTrackOnly) {
                 gridHtml += `<div class="kpi-target" style="font-weight:bold; color:${topBorder}; font-size:1em; margin-top:5px;">${displayColor}</div>`;
            } else if (displayColor === "Blue") {
                gridHtml += `<div class="kpi-blue-win">Keep going to keep this blue! 🟦</div>`;
            } else if (displayColor === "Green") {
                gridHtml += `<div class="kpi-target">Need <span style="color:#3498db;">${Math.max(0, remBlue)}</span> for Blue</div>`;
            } else if (displayColor === "Amber") {
                gridHtml += `<div class="kpi-target">Need <span style="color:#27ae60;">${Math.max(0, remGreen)}</span> for Green</div>
                             <div class="kpi-target">Need <span style="color:#3498db;">${Math.max(0, remBlue)}</span> for Blue</div>`;
            } else { // Red
                gridHtml += `<div class="kpi-target">Need <span style="color:#f39c12;">${Math.max(0, remAmber)}</span> for Amber</div>
                             <div class="kpi-target">Need <span style="color:#27ae60;">${Math.max(0, remGreen)}</span> for Green</div>
                             <div class="kpi-target">Need <span style="color:#3498db;">${Math.max(0, remBlue)}</span> for Blue</div>`;
            }
            gridHtml += `</div>`;
        });

        document.getElementById('sc-kpi-grid').innerHTML = gridHtml;
    }

    function sendScorecardUpdate(kpiName, val) {
        if (!SCORECARD_URL || SCORECARD_URL === "YOUR_SCRIPT_URL_HERE") return;
        
        if (!scorecardUpdateQueue[kpiName]) scorecardUpdateQueue[kpiName] = 0;
        scorecardUpdateQueue[kpiName] += val;
        
        document.getElementById('sc-last-sync').innerText = "Queuing sale...";
        
        clearTimeout(scorecardUpdateTimer);
        scorecardUpdateTimer = setTimeout(() => {
            flushScorecardUpdates();
        }, 1000); 
    }

    function flushScorecardUpdates() {
        let updates = Object.entries(scorecardUpdateQueue).filter(([k,v]) => v !== 0);
        scorecardUpdateQueue = {}; 
        if(updates.length === 0) return;
        
        document.getElementById('sc-last-sync').innerText = "Sending batched sales to HQ...";
        
        let chain = Promise.resolve();
        updates.forEach(([kpiName, val]) => {
            chain = chain.then(() => fetch(`${SCORECARD_URL}?action=update&kpi=${encodeURIComponent(kpiName)}&val=${val}`, { mode: 'no-cors' }));
        });
        
        chain.then(() => {
            document.getElementById('sc-last-sync').innerText = "Waiting for HQ Math...";
            setTimeout(fetchScorecard, 2000);
            setTimeout(fetchScorecard, 5000);
            setTimeout(fetchScorecard, 9000);
        }).catch(e => console.log(e));
    }

    setInterval(fetchScorecard, 60000);
    setTimeout(fetchScorecard, 1000);

    // --- DEALS ENGINE ---
    let dealsData = [];
    let dealCategories = [];
    let currentCategory = '';

    async function openDealsModal() {
        const modal = document.getElementById('dealsModal');
        if(modal) modal.style.display = 'flex';
        const container = document.getElementById('dealsContainer');
        
        if(container) container.innerHTML = '<div style="text-align: center; color: #777; padding: 20px;">Fetching live deals from HQ... 🔄</div>';
        
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 3500); 

        try {
            const res = await fetch(PUBLISHED_CSV_URL + '&_buster=' + Date.now(), { 
                signal: controller.signal,
                cache: "no-store" 
            });
            clearTimeout(timeoutId);
            
            if (!res.ok) throw new Error("Network response was not ok");
            const text = await res.text();
            processDealsCSV(text);
            
        } catch (e) {
            console.log("Fetch blocked or timed out. Loading local fallback data.");
            loadLocalTestData();
        }
    }

    function loadLocalTestData() {
        const container = document.getElementById('dealsContainer');
        const testCSV = `Category,Headline,Tagline,Total Monthly,Upfront,Device Name,Device Term,Device Monthly,Total Device Cost,Airtime Plan,Airtime Monthly,2nd Device Name,2nd Device Term,2nd Device Monthly,Console Name,Console Term,Console Monthly,Addline Name,Addline Term,Addline Monthly,Addline Details,Valid until
Samsung,Samsung S24 Ultra Bundle,The ultimate pro setup.,£85.00,£30.00,Galaxy S24 Ultra,36 Months,£45.00,£1620,Unlimited Data,£20.00,Galaxy Watch 6,24 Months,£20.00,,,
Apple,iPhone 15 Pro Max,Pro camera. Pro display.,£70.00,£50.00,iPhone 15 Pro Max,36 Months,£48.00,£1728,100GB Data,£22.00,,,,,,,,,,
Broadband,Full Fibre 900 + PS5,Ultimate home bundle.,£60.00,£0.00,Smart Hub Plus,,£0.00,,Home Broadband,£40.00,,,,PS5 Digital,,`;
        
        if(container) {
            container.innerHTML = `
                <div style="background-color: #fff3cd; color: #856404; padding: 10px; border-radius: 6px; font-size: 0.85em; text-align: center; margin-bottom: 15px; border: 1px solid #ffeeba;">
                    ⚠️ <strong>LOCAL MODE:</strong> Desktop browser blocked live fetch. Showing local test deals.
                </div>
            `;
        }
        processDealsCSV(testCSV, true);
    }

    function closeDealsModal() {
        const modal = document.getElementById('dealsModal');
        if(modal) modal.style.display = 'none';
    }

    function parseCSV(str) {
        const arr = [];
        let quote = false;
        for (let row = 0, col = 0, c = 0; c < str.length; c++) {
            let cc = str[c], nc = str[c+1];
            arr[row] = arr[row] || [];
            arr[row][col] = arr[row][col] || '';
            if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
            if (cc == '"') { quote = !quote; continue; }
            if (cc == ',' && !quote) { ++col; continue; }
            if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; continue; }
            if (cc == '\n' && !quote) { ++row; col = 0; continue; }
            if (cc == '\r' && !quote) { ++row; col = 0; continue; }
            arr[row][col] += cc;
        }
        return arr;
    }

    function parseExpiryDate(dateStr) {
        if (!dateStr) return null;
        let cleanStr = dateStr.trim().replace(/"/g, '').split(' ')[0];
        let parts = cleanStr.split(/[\/\-]/);
        
        if (parts.length === 3) {
            let p0 = parseInt(parts[0]);
            let p1 = parseInt(parts[1]);
            let p2 = parseInt(parts[2]);
            let y, m, d;
            
            if (p0 > 1000) { y = p0; m = p1 - 1; d = p2; } 
            else if (p2 > 1000) { y = p2; m = p1 - 1; d = p0; } 
            else { y = p2 + 2000; m = p1 - 1; d = p0; }
            
            let parsedDate = new Date(y, m, d);
            if (!isNaN(parsedDate)) return parsedDate;
        }
        let fallback = new Date(dateStr);
        return isNaN(fallback) ? null : fallback;
    }

    function processDealsCSV(csvText, isFallback = false) {
        const rows = parseCSV(csvText);
        dealsData = [];
        dealCategories = [];
        
        let currentAppDate = new Date();
        currentAppDate.setDate(currentAppDate.getDate() + (parseInt(localStorage.getItem('eeRhylSimOffset')) || 0));
        currentAppDate.setHours(0, 0, 0, 0); 
        
        for (let i = 1; i < rows.length; i++) {
            const row = rows[i];
            if (!row || row.length < 2 || !row[0].trim()) continue; 
            
            let expiryStr = row[21] ? row[21].trim() : '';
            let expiryDate = parseExpiryDate(expiryStr);
            if (expiryDate) {
                expiryDate.setHours(23, 59, 59, 999); 
                if (currentAppDate > expiryDate) continue; 
            }

            let cat = row[0].trim();
            if (!dealCategories.includes(cat)) dealCategories.push(cat);
            
            const getVal = (colIndex) => row[colIndex] ? row[colIndex].trim() : '';

            dealsData.push({
                category: cat,
                headline: getVal(1),
                tagline: getVal(2),
                totalMonthly: getVal(3),
                upfront: getVal(4),
                d1Name: getVal(5),
                d1Term: getVal(6),
                d1Price: getVal(7),
                d1Total: getVal(8),
                airtimePlan: getVal(9),
                airtimePrice: getVal(10),
                d2Name: getVal(11),
                d2Term: getVal(12),
                d2Price: getVal(13),
                consoleName: getVal(14),
                consoleTerm: getVal(15),
                consoleMonthly: getVal(16),
                addlineName: getVal(17),
                addlineTerm: getVal(18),
                addlineMonthly: getVal(19),
                addlineDetails: getVal(20)
            });
        }
        
        if (dealCategories.length > 0) {
            if (!dealCategories.includes(currentCategory)) {
                currentCategory = dealCategories[0];
            }
            renderDealsUI(isFallback);
        } else {
            let container = document.getElementById('dealsContainer');
            if(container) container.innerHTML = '<div style="text-align: center; color: #777; padding: 20px;">No deals found. Check your sheet or expiration dates!</div>';
            let tabs = document.getElementById('dealsTabs');
            if(tabs) tabs.innerHTML = '';
        }
    }

    function renderDealsUI(isFallback = false) {
        let tabsHtml = '';
        dealCategories.forEach(cat => {
            tabsHtml += `<div class="deal-tab ${cat === currentCategory ? 'active' : ''}" onclick="switchDealTab('${cat.replace(/'/g, "\\'")}')">${cat}</div>`;
        });
        let dt = document.getElementById('dealsTabs');
        if(dt) dt.innerHTML = tabsHtml;
        
        let dealsHtml = '';
        const activeDeals = dealsData.filter(d => d.category === currentCategory);
        
        activeDeals.forEach((deal, idx) => {
            dealsHtml += `
            <div class="deal-card" id="deal-card-${idx}">
                <div class="deal-header" onclick="toggleDeal(${idx})">
                    <div class="deal-header-left">
                        <h4 class="deal-headline">${deal.headline}</h4>
                        ${deal.tagline ? `<div class="deal-tagline">${deal.tagline}</div>` : ''}
                    </div>
                    <div class="deal-header-right">
                        <span class="deal-price">${deal.totalMonthly}</span>
                        <span class="deal-upfront">${deal.upfront ? 'Up: ' + deal.upfront : ''}</span>
                    </div>
                </div>
                <div class="deal-details" id="deal-details-${idx}">
                    ${deal.d1Name ? `
                    <div class="breakdown-row">
                        <span class="breakdown-label">📱 Device<span class="breakdown-sub">${deal.d1Name} ${deal.d1Term ? '('+deal.d1Term+')' : ''}</span></span>
                        <span class="breakdown-val">${deal.d1Price}${deal.d1Total ? '<span class="breakdown-sub">Total: '+deal.d1Total+'</span>' : ''}</span>
                    </div>` : ''}
                    
                    ${deal.airtimePlan ? `
                    <div class="breakdown-row">
                        <span class="breakdown-label">📶 Airtime<span class="breakdown-sub">${deal.airtimePlan}</span></span>
                        <span class="breakdown-val">${deal.airtimePrice}</span>
                    </div>` : ''}
                    
                    ${deal.d2Name ? `
                    <div class="breakdown-row">
                        <span class="breakdown-label">⌚ Add-on<span class="breakdown-sub">${deal.d2Name} ${deal.d2Term ? '('+deal.d2Term+')' : ''}</span></span>
                        <span class="breakdown-val">${deal.d2Price}</span>
                    </div>` : ''}

                    ${deal.consoleName ? `
                    <div class="breakdown-row">
                        <span class="breakdown-label">🎮 Game Console<span class="breakdown-sub">${deal.consoleName} ${deal.consoleTerm ? '('+deal.consoleTerm+')' : ''}</span></span>
                        <span class="breakdown-val">${deal.consoleMonthly}</span>
                    </div>` : ''}

                    ${deal.addlineName ? `
                    <div class="breakdown-row">
                        <span class="breakdown-label">📦 Extra Handset<span class="breakdown-sub">${deal.addlineName} ${deal.addlineTerm ? '('+deal.addlineTerm+')' : ''}</span></span>
                        <span class="breakdown-val">${deal.addlineMonthly}${deal.addlineDetails ? '<span class="breakdown-sub">'+deal.addlineDetails+'</span>' : ''}</span>
                    </div>` : ''}
                </div>
            </div>`;
        });
        
        let dc = document.getElementById('dealsContainer');
        if(dc) {
            if(isFallback && !dc.innerHTML.includes('LOCAL MODE')) {
                dc.innerHTML = `
                <div style="background-color: #fff3cd; color: #856404; padding: 10px; border-radius: 6px; font-size: 0.85em; text-align: center; margin-bottom: 15px; border: 1px solid #ffeeba;">
                    ⚠️ <strong>LOCAL MODE:</strong> Desktop browser blocked live fetch. Showing local test deals.
                </div>` + dealsHtml;
            } else {
                dc.innerHTML = dealsHtml;
            }
        }
    }

    function switchDealTab(cat) { 
        currentCategory = cat; 
        renderDealsUI(); 
    }

    function toggleDeal(idx) {
        const card = document.getElementById(`deal-card-${idx}`);
        const details = document.getElementById(`deal-details-${idx}`);
        if (details && card) {
            if (details.classList.contains('show')) {
                details.classList.remove('show'); card.classList.remove('open');
            } else {
                details.classList.add('show'); card.classList.add('open');
            }
        }
    }
    // --- END HOT DEALS ENGINE ---

    function getTodayStr() {
        let d = new Date();
        d.setDate(d.getDate() + (parseInt(localStorage.getItem('eeRhylSimOffset')) || 0));
        return d.toISOString().split('T')[0];
    }

    function simulateNextDay() {
        let simulatedDateOffset = parseInt(localStorage.getItem('eeRhylSimOffset')) || 0;
        simulatedDateOffset += 1;
        localStorage.setItem('eeRhylSimOffset', simulatedDateOffset);
        isDevMode = false;
        localStorage.removeItem('eeRhylDevMode');
        alert("Time Travel Activated ⏩\nIt is now tomorrow. You have been logged out of Admin Mode.");
        location.reload(); 
    }

    function checkVersion() {
        let savedVersion = localStorage.getItem('eeRhylVersion');
        if (savedVersion !== APP_VERSION) {
            let clModal = document.getElementById('changelogModal');
            if (clModal) clModal.style.display = 'flex';
        }
    }
    
    function closeChangelog() {
        localStorage.setItem('eeRhylVersion', APP_VERSION);
        let clModal = document.getElementById('changelogModal');
        if (clModal) clModal.style.display = 'none';
    }

    function openChangelogTester() {
        let clModal = document.getElementById('changelogModal');
        if (clModal) clModal.style.display = 'flex';
    }

    function enterDevMode() {
        if(isDevMode) {
            if(confirm("Disable Developer Mode?")) {
                isDevMode = false;
                localStorage.removeItem('eeRhylSimOffset');
                localStorage.removeItem('eeRhylDevMode');
                alert("Developer Mode Disabled.");
                location.reload(); 
            }
            return;
        }
        let dpModal = document.getElementById('devPasswordModal');
        if (dpModal) dpModal.style.display = 'flex';
        let dpInput = document.getElementById('devPwdInput');
        if (dpInput) { dpInput.value = ''; setTimeout(() => dpInput.focus(), 100); }
    }
    
    function closeDevModal() {
        let dpModal = document.getElementById('devPasswordModal');
        if (dpModal) dpModal.style.display = 'none';
    }
    
    function submitDevPassword() {
        let dpInput = document.getElementById('devPwdInput');
        if (!dpInput) return;
        let p = dpInput.value;
        if (!p) return;
        if (btoa(p.split('').reverse().join('')) === "MXNwb3ZlZA==") {
            isDevMode = true;
            localStorage.setItem('eeRhylDevMode', 'true');
            let dpModal = document.getElementById('devPasswordModal');
            if (dpModal) dpModal.style.display = 'none';
            alert("Developer Mode Unlocked.");
            location.reload(); 
        } else {
            alert("Incorrect Password.");
            dpInput.value = '';
        }
    }
    
    let devPwdInputEl = document.getElementById("devPwdInput");
    if (devPwdInputEl) {
        devPwdInputEl.addEventListener("keyup", function(event) {
            if (event.key === "Enter") submitDevPassword(); 
        });
    }

    function toggleSetupMode() {
        isSetupMode = !isSetupMode;
        let btn = document.getElementById('setupModeBtn');
        if (btn) {
            if(isSetupMode) { 
                btn.innerHTML = "✅ Save & Activate Coach"; 
                btn.style.backgroundColor = "#27ae60"; 
            } else { 
                btn.innerHTML = "🛠️ Enable Setup Mode"; 
                btn.style.backgroundColor = "#f39c12"; 
                isInitial = true; 
                localStorage.removeItem('eeRhylCoachPicks'); 
            }
        }
        calculate();
    }

    function toggleCoach() {
        isCoachMinimized = !isCoachMinimized;
        localStorage.setItem('eeRhylCoachMinimized', isCoachMinimized);
        calculate();
    }

    function lockMonth() {
        if (pacingData.total <= 0) { 
            alert("Please enter your Total Shifts for the month before locking."); 
            return; 
        }
        if (confirm("Are you sure this is correct? You won't be able to adjust targets or total shifts without developer access.")) {
            pacingData.monthLocked = true;
            pacingData.lastUpdate = getTodayStr(); 
            localStorage.setItem('eeRhylPacing', JSON.stringify(pacingData));
            isInitial = true; 
            calculate();
            window.scrollTo(0,0);
        }
    }

    function confirmDailyShifts() {
        let modal = document.getElementById('confirmShiftsModal');
        if (modal) modal.style.display = 'flex';
    }
    
    function closeConfirmModal() { 
        let modal = document.getElementById('confirmShiftsModal');
        if (modal) modal.style.display = 'none'; 
    }
    
    function executeConfirmShifts() {
        pacingData.lastUpdate = getTodayStr();
        localStorage.setItem('eeRhylPacing', JSON.stringify(pacingData));
        let modal = document.getElementById('confirmShiftsModal');
        if (modal) modal.style.display = 'none';
        calculate();
    }

    function setCoachStrategy(choice) {
        let dailyPicks = JSON.parse(localStorage.getItem('eeRhylCoachPicks'));
        if (dailyPicks) {
            dailyPicks.comebackChoice = choice;
            localStorage.setItem('eeRhylCoachPicks', JSON.stringify(dailyPicks));
            calculate();
        }
    }

    function resetCoachStrategy() {
        let dailyPicks = JSON.parse(localStorage.getItem('eeRhylCoachPicks'));
        if (dailyPicks) {
            dailyPicks.comebackChoice = null;
            localStorage.setItem('eeRhylCoachPicks', JSON.stringify(dailyPicks));
            calculate();
        }
    }

    function forceRefreshCoach() { 
        let dailyPicks = JSON.parse(localStorage.getItem('eeRhylCoachPicks')) || {};
        dailyPicks.refreshMobile = true;
        localStorage.setItem('eeRhylCoachPicks', JSON.stringify(dailyPicks));
        calculate(); 
    }
    
    function manualUpdateShifts() {
        let scInput = document.getElementById('shiftsCompleted');
        if (scInput) {
            pacingData.completed = parseInt(scInput.value) || 0;
            localStorage.setItem('eeRhylPacing', JSON.stringify(pacingData));
            calculate();
        }
    }
    
    function adjustShifts(c) { 
        pacingData.completed = Math.max(0, pacingData.completed + c); 
        let scInput = document.getElementById('shiftsCompleted');
        if (scInput) scInput.value = pacingData.completed; 
        localStorage.setItem('eeRhylPacing', JSON.stringify(pacingData));
        calculate(); 
    }
    
    function checkShiftLocks() {
        let todayStr = getTodayStr();
        let shiftAlert = document.getElementById('shiftAlertBanner');
        let shiftInput = document.getElementById('shiftsCompleted');
        let minusBtn = document.getElementById('shiftMinusBtn');
        let plusBtn = document.getElementById('shiftPlusBtn');
        let lockMsg = document.getElementById('shiftLockMsg');
        let confirmBtn = document.getElementById('confirmShiftsBtn');

        if (!shiftInput) return false; 

        if (!isDevMode) { 
            if (minusBtn) minusBtn.style.display = 'none'; 
        } else { 
            if (minusBtn) minusBtn.style.display = 'inline-block'; 
        }

        if (!pacingData.monthLocked || isSetupMode) {
            if (shiftAlert) shiftAlert.style.display = 'none';
            shiftInput.disabled = false;
            if (plusBtn) plusBtn.style.display = 'inline-block';
            if (minusBtn) minusBtn.style.display = isDevMode ? 'inline-block' : 'none'; 
            if (plusBtn) plusBtn.disabled = false;
            if (confirmBtn) confirmBtn.style.display = 'none';
            if (lockMsg) lockMsg.style.display = 'none';
            return false; 
        }

        if (pacingData.lastUpdate === todayStr) {
            if (shiftAlert) shiftAlert.style.display = 'none';
            shiftInput.disabled = true;
            if (plusBtn) plusBtn.style.display = 'none';
            if (minusBtn) minusBtn.style.display = 'none';
            if (confirmBtn) confirmBtn.style.display = 'none';
            if (lockMsg) { lockMsg.style.display = 'block'; lockMsg.innerText = "🔒 Locked for today"; }
            shiftInput.style.borderBottom = 'none';
            
            if (isDevMode) {
                 shiftInput.disabled = false;
                 if (plusBtn) plusBtn.style.display = 'inline-block';

                 shiftInput.style.borderBottom = '1px dashed #b2e0e3';

    function quickAdjust(i, f, c) { 
        categories[i][f] = Math.max(0, (categories[i][f] || 0) + c);

        let tInput = document.getElementById(`target-in-${i}`);

        else if (f === 'target' && tInput) { tInput.value = categories[i][f]; }

            if (catName === "NEW HANDSETS" || catName === "NEW PAYM/SIM") {

    function getKPIColor(p) { return p < 50 ? '#e74c3c' : p < 100 ? '#f39c12' : p < 125 ? '#27ae60' : '#2980b9'; }
    function getOverallColor(p) { return p < 50 ? '#e74c3c' : p < 75 ? '#f39c12' : p < 125 ? '#27ae60' : '#2980b9'; }
    
    function fireConfetti(colors) { 
        if (typeof confetti === 'function') { 
            let confConfig = { particleCount: 100, spread: 70, origin: { y: 0.6 } }; 
            if(colors) confConfig.colors = colors; 
            confetti(confConfig); 
        } 
    }

    function fireMoneyRain() {
        if (typeof confetti !== 'function') return;
        var duration = 3000;
        var animationEnd = Date.now() + duration;
        var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 1000, colors: ['#FFD700', '#DAA520', '#F8E231', '#ffffff'] };
        function randomInRange(min, max) { return Math.random() * (max - min) + min; }
        var interval = setInterval(function() {
            var timeLeft = animationEnd - Date.now();
            if (timeLeft <= 0) { return clearInterval(interval); }
            var particleCount = 50 * (timeLeft / duration);
            confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
            confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
        }, 250);
    }

    function animateValue(element, start, end, duration) {
        if (!element) return;
        if (isNaN(start) || isNaN(end)) {
            element.innerText = (end || 0).toFixed(2) + '%';
            return;
        }
        let startTimestamp = null;
        const step = (timestamp) => {
            if (!startTimestamp) startTimestamp = timestamp;
            const progress = Math.min((timestamp - startTimestamp) / duration, 1);
            const easeProgress = progress * (2 - progress);
            element.innerText = (start + (easeProgress * (end - start))).toFixed(2) + '%';
            if (progress < 1) window.requestAnimationFrame(step);
            else element.innerText = end.toFixed(2) + '%';
        };
        window.requestAnimationFrame(step);
    }

    function updateBufferDays(currentP) {
        let bufferEl = document.getElementById('bufferContainer');
        if (!bufferEl) return;

        let totalS = parseFloat(pacingData.total);
        if (totalS <= 0 || currentP >= 75 || !pacingData.monthLocked) {
            bufferEl.style.display = 'none';
            return;
        }
        let dailyPace = 75 / totalS;
        let expectedBenchmark = dailyPace * pacingData.completed;
        let aheadByPercentage = currentP - expectedBenchmark;
        let bufferShifts = aheadByPercentage / dailyPace;
        
        let safeShifts = Math.floor(bufferShifts);
        
        bufferEl.style.display = 'block';
        if (safeShifts >= 1) { 
            bufferEl.className = "buffer-box buffer-green";
            bufferEl.innerHTML = `<div style="font-size: 1.25em;">🟢 <strong>+${safeShifts} Buffer Day${safeShifts > 1 ? 's' : ''} Banked</strong></div><div class="buffer-desc">A "Buffer Day" means you are ahead of target! You can afford to sell <strong>0</strong> items on your next <strong>${safeShifts}</strong> shift${safeShifts > 1 ? 's' : ''} and still stay perfectly on track.</div>`;
        } else if (safeShifts === 0) {
            bufferEl.className = "buffer-box buffer-red";
            bufferEl.innerHTML = `<div style="font-size: 1.25em;">🔴 <strong>0 Buffer Days Banked</strong></div><div class="buffer-desc">You are currently on the line. Your safety net is empty, meaning you must hit the Coach targets today to avoid dropping behind pace.</div>`;
        } else {
            let behind = Math.abs(safeShifts);
            bufferEl.className = "buffer-box buffer-red";
            bufferEl.innerHTML = `<div style="font-size: 1.25em;">🔴 <strong>-${behind} Buffer Day${behind !== 1 ? 's' : ''} (Behind Pace)</strong></div><div class="buffer-desc">You are mathematically behind by ${behind} full shift${behind !== 1 ? 's' : ''}. Use the Coach's Catch-Up Strategy to rebuild your momentum and get back to 0.</div>`;
        }
    }

    function calculate() {
        let appLocked = checkShiftLocks();
        let setupBtn = document.getElementById('setupModeBtn');
        let lockBtn = document.getElementById('lockMonthBtn');
        let devPanel = document.getElementById('devPanel');
        let totalShiftsInput = document.getElementById('totalShifts');
        let isTargetsLocked = false;
        
        const currentEl = document.getElementById('currentOverall');
        let sumContainer = document.getElementById('shiftSummaryContainer');
        let maxMsg = document.getElementById('maximizerMessage');
        let commBanner = document.getElementById('commissionBanner');
        let tabContainer = document.getElementById('tablesContainer');
        let missionMessage = document.getElementById('missionMessage');
        
        if (devPanel) devPanel.style.display = isDevMode ? 'block' : 'none';
        
        if (isDevMode && pacingData.monthLocked) { 
            if (setupBtn) setupBtn.style.display = 'block'; 
        } else { 
            if (setupBtn) setupBtn.style.display = 'none'; 
        }

        if (!pacingData.monthLocked && !isSetupMode) {
            if (lockBtn) lockBtn.style.display = 'block';
            if (totalShiftsInput) {
                totalShiftsInput.disabled = false;
                totalShiftsInput.style.border = '2px solid #b2e0e3';
                totalShiftsInput.style.background = 'white';

                    totalShiftsInput.disabled = true;
                    totalShiftsInput.style.border = 'none';
                    totalShiftsInput.style.background = 'transparent';
                }
                isTargetsLocked = true;
            } else {
                if (totalShiftsInput) {
                    totalShiftsInput.disabled = false;
                    totalShiftsInput.style.border = '2px solid #b2e0e3';
                    totalShiftsInput.style.background = 'white';
                }
                isTargetsLocked = false;
            }
        }

        for(let i=0; i<6; i++) {
             let tInput = document.getElementById(`target-in-${i}`);
             let tMinus = document.getElementById(`target-minus-${i}`);
             let tPlus = document.getElementById(`target-plus-${i}`);
             
             if(tInput) tInput.disabled = isTargetsLocked;
             if(tMinus) tMinus.style.display = isTargetsLocked ? 'none' : 'inline-block';
             if(tPlus) tPlus.style.display = isTargetsLocked ? 'none' : 'inline-block';
        }

        let totalKPI = 0;
        let active = [];
        let shouldFireConfetti = false;
        let oldKPIs = [...previousKPIs];
        
        let shiftsLeftInCalc = pacingData.total - pacingData.completed;

        categories.forEach((cat, i) => {
            let p = 0; let vps = 0;
            if(cat.target > 0) {
                vps = (100 / cat.target / 6);
                p = (cat.achieved / cat.target * 100);
                totalKPI += (cat.achieved / cat.target);
                active.push({ index: i, name: cat.name, vps: vps });
            }
            if (!isInitial && p >= 100 && previousKPIs[i] < 100) { shouldFireConfetti = true; }
            previousKPIs[i] = p; 
            
            let fillEl = document.getElementById(`kpi-fill-${i}`);
            let textEl = document.getElementById(`kpi-text-${i}`);
            let vpsEl = document.getElementById(`vps-text-${i}`);
            let rrEl = document.getElementById(`daily-rr-${i}`);
            
            if (fillEl && textEl && vpsEl) {
                let color = getKPIColor(p);
                fillEl.style.width = Math.min(p, 100) + '%';
                fillEl.style.backgroundColor = color;
                textEl.innerText = p.toFixed(2) + '%';
                textEl.style.color = color;
                vpsEl.innerText = vps.toFixed(2) + '%';
            }

            if (rrEl) {
                let dailyRR = "-";
                if (pacingData.total > 0) {
                    if (cat.target > 0 && cat.achieved >= cat.target) {
                        dailyRR = "✓";
                        rrEl.style.color = "#27ae60";
                    } else if (shiftsLeftInCalc > 0 && cat.target > 0) {
                        let needed = cat.target - cat.achieved;
                        dailyRR = Math.ceil(needed / shiftsLeftInCalc).toString();
                        rrEl.style.color = "#d35400";
                    } else if (cat.target > 0) {
                        dailyRR = (cat.target - cat.achieved).toString();
                        rrEl.style.color = "#d35400";
                    }
                }
                rrEl.innerText = dailyRR;
            }
        });

        const currentP = (totalKPI / 6) * 100;

        if (isSetupMode || !pacingData.monthLocked) {
            if (currentEl) {
                currentEl.innerText = "---"; 
                currentEl.style.color = "#ccc"; 
            }
            
            let bufferContainer = document.getElementById('bufferContainer');
            if (bufferContainer) bufferContainer.style.display = 'none';
            
            if (missionMessage) {
                missionMessage.style.display = 'block';
                missionMessage.className = "mission-message mission-setup";
                
                if (isSetupMode) {
                    missionMessage.innerHTML = `<div style="text-align:center;"><strong>🛠️ SETUP MODE ACTIVE</strong><br><br><span style="font-size:0.95em; color:#555;">Enter your mid-month numbers in peace. The Coach and master stats are paused.<br><br>Click <strong>Save & Activate Coach</strong> at the top when you are finished!</span></div>`;
                } else {
                    missionMessage.innerHTML = `
                        <div style="padding: 10px;">
                            <h3 style="color:#005c63; margin-top:0; text-align:center;">👋 Welcome to a New Month!</h3>
                            <p style="color:#555; font-size:0.95em;">Here is how to set up your Daily Coach:</p>
                            <ol style="color:#444; font-size:0.9em; padding-left: 20px; line-height: 1.6; margin-bottom: 15px;">
                                <li>Enter your <strong>Monthly Targets</strong> in the table below.</li>
                                <li>Enter your <strong>Total Shifts</strong> for the month.</li>
                                <li>Leave <em>Completed Shifts</em> and <em>Achieved</em> at 0.</li>
                                <li>Click <strong>🔒 Lock In Targets & Shifts</strong> at the top to activate your playbook!</li>
                            </ol>
                            <div style="background-color: #fff3cd; color: #856404; padding: 12px; border-radius: 6px; font-size: 0.85em; border: 1px solid #ffeeba;">
                                ⚠️ <strong>CRITICAL RULE:</strong> You must ONLY update your Completed Shifts and Sales the <strong>NEXT MORNING</strong> after you work. Doing it during your shift will break the math!
                            </div>
                        </div>`;
                }
            }
            
            if (maxMsg) maxMsg.style.display = 'none';
            if (sumContainer) sumContainer.style.display = 'none';
            if (commBanner) commBanner.style.display = 'none';
            if (tabContainer) tabContainer.classList.remove('locked-area');
            document.body.classList.remove('body-gold', 'body-fire');
            let mc = document.getElementById('mainContainer');
            if (mc) mc.classList.remove('container-gold', 'container-fire');
            let ml = document.getElementById('mainLogo');
            if (ml) ml.classList.remove('logo-gold', 'logo-fire');

            localStorage.setItem('eeRhylPrevKPIs', JSON.stringify(previousKPIs));
            return; 
        }

        updateBufferDays(currentP);

        if (appLocked) {
            if (currentEl) {
                currentEl.innerText = "🔒"; 
                currentEl.style.color = "#e74c3c"; 
            }

            if (missionMessage) {
                missionMessage.style.display = 'block';
                missionMessage.className = "mission-message mission-raw";
                missionMessage.innerHTML = `<div style="text-align:center; padding: 10px;"><strong>🔒 APP LOCKED</strong><br><br><span style="font-size:0.95em; color:#555;">The Coach and Projections are disabled to protect the math. Please update your <strong>Completed Shifts</strong> above and click <strong>CONFIRM</strong> to unlock the app for today!</span></div>`;
            }
            
            if (maxMsg) maxMsg.style.display = 'none';
            if (sumContainer) sumContainer.style.display = 'none';
            if (commBanner) commBanner.style.display = 'none';
            if (tabContainer) tabContainer.classList.add('locked-area');
            document.body.classList.remove('body-gold', 'body-fire');
            let mc = document.getElementById('mainContainer');
            if (mc) mc.classList.remove('container-gold', 'container-fire');
            let ml = document.getElementById('mainLogo');
            if (ml) ml.classList.remove('logo-gold', 'logo-fire');
            return; 
        } else {
            if (tabContainer) tabContainer.classList.remove('locked-area');
        }

        try {
            if (isInitial) { 
                if (currentEl) currentEl.innerText = currentP.toFixed(2) + '%'; 
            } else { 
                animateValue(currentEl, displayedCurrentOverall, currentP, 700); 
            }
        } catch(e) {
            if (currentEl) currentEl.innerText = currentP.toFixed(2) + '%'; 
        }
        
        displayedCurrentOverall = currentP; 
        if (currentEl) currentEl.style.color = getOverallColor(currentP);
        localStorage.setItem('eeRhylPrevKPIs', JSON.stringify(previousKPIs));

        let hit75 = false;
        let prevScore = parseFloat(localStorage.getItem('prevScore') || 0);
        if (!isInitial && currentP >= 75 && prevScore < 75) { hit75 = true; }
        localStorage.setItem('prevScore', currentP);

        if (hit75) { fireMoneyRain(); } else if (shouldFireConfetti && currentP < 75) { fireConfetti(); }
        
        if (commBanner) commBanner.style.display = currentP >= 75 ? 'block' : 'none';

        let mc = document.getElementById('mainContainer');
        let ml = document.getElementById('mainLogo');

        if (currentP >= 75) {
            document.body.classList.add('body-gold');
            if (mc) mc.classList.add('container-gold');
            if (ml) ml.classList.add('logo-gold');
            document.body.classList.remove('body-fire');
            if (mc) mc.classList.remove('container-fire');
            if (ml) ml.classList.remove('logo-fire');
        } else {
            document.body.classList.remove('body-gold');
            if (mc) mc.classList.remove('container-gold');
            if (ml) ml.classList.remove('logo-gold');
        }

        updateMission(currentP, active, oldKPIs);
        isInitial = false;
    }
